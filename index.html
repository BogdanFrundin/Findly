<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FINDLY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..400,0..1,0&display=block">
<style>
/* Layout: an app column (phone frame on desktop) with a screen map beside it; ivory & ink, champagne used sparingly */
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface2:#efe9e0; --tile:#e8e1d6; --ink:#151311; --muted:#7b7269;
  --line:#e1d9cd; --accent:#a8865a; --accent-ink:#86683f; --on-ink:#f6f3ee; --stage:#e9e4dc;
  --art1:#ece4d7; --art2:#d9cbb6; --scrim:rgba(21,19,17,.55);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --ui:"Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121010; --surface:#1a1715; --surface2:#231f1c; --tile:#cfc6b8; --ink:#eee7dc; --muted:#9e9388;
  --line:#2f2a26; --accent:#c6a574; --accent-ink:#d6b888; --on-ink:#121010; --stage:#0b0a09;
  --art1:#2a2420; --art2:#3d342c; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121010; --surface:#1a1715; --surface2:#231f1c; --tile:#cfc6b8; --ink:#eee7dc; --muted:#9e9388;
  --line:#2f2a26; --accent:#c6a574; --accent-ink:#d6b888; --on-ink:#121010; --stage:#0b0a09;
  --art1:#2a2420; --art2:#3d342c; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.ms{font-family:"Material Symbols Outlined";font-weight:300;font-size:20px;line-height:1;font-variation-settings:'FILL' 0,'wght' 300,'opsz' 24;display:inline-block;vertical-align:middle;user-select:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 300,'opsz' 24}

/* stage */
.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:56px}
.map{display:none}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:980px){
  .stage{padding-block:28px}
  .phone{width:390px;height:min(844px,100%);border-radius:44px;box-shadow:0 0 0 10px #111,0 30px 80px rgba(0,0,0,.28)}
  .map{display:flex;flex-direction:column;gap:2px;width:240px;max-height:100%;overflow:auto}
  .fab{display:none!important}
}
.map h2{font:500 22px/1.1 var(--display);margin:0 0 4px;letter-spacing:.02em}
.map p{margin:0 0 14px;color:var(--muted);font-size:12px}
.map button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:6px 8px;border-radius:2px;font-size:13px;color:var(--muted)}
.map button b{font-weight:500;font-variant-numeric:tabular-nums;font-size:11px;width:18px;color:var(--muted)}
.map button:hover{color:var(--ink)}
.map button.on{color:var(--ink);background:var(--surface)}
.map .grp{margin:10px 0 2px 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}

.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.has-nav{padding-bottom:76px}
.scr{min-height:100%;animation:enter .6s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding-inline:20px}

/* type */
.eyebrow{font:600 10.5px/1.3 var(--ui);letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.eyebrow.acc{color:var(--accent-ink)}
.h1{font:400 34px/1.08 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.h1 i,.h2 i{font-style:italic;color:var(--accent-ink)}
.h2{font:400 24px/1.15 var(--display);margin:0;text-wrap:balance}
.h3{font:500 18px/1.25 var(--display);margin:0}
.lead{color:var(--muted);margin:0;font-size:14px;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
.price{font-weight:500;font-variant-numeric:tabular-nums}
.old{color:var(--muted);text-decoration:line-through;font-size:12px;font-variant-numeric:tabular-nums}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;background:var(--ink);color:var(--on-ink);font:600 11px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;width:100%;transition:opacity .3s,transform .3s var(--ease)}
.btn:active{transform:scale(.99);opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn.sm{height:38px;font-size:10px;padding:0 14px;width:auto}
.btn .ms{font-size:17px}
.link{font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;box-shadow:inset 0 0 0 1px var(--line);font:500 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--surface);transition:background .3s,color .3s}
.chip.on{background:var(--ink);color:var(--on-ink);box-shadow:none}
.chip .ms{font-size:14px;color:var(--muted)}
.chip.on .ms{color:var(--on-ink)}
.chip.parse{opacity:0;transform:translateY(6px);animation:enter .5s var(--ease) forwards}
.hair{height:1px;background:var(--line);border:0;margin:0}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;position:relative}
.dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:34px 0 14px}

/* header + nav */
.hdr{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;justify-content:space-between;padding-inline:20px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{font:500 21px/1 var(--display);letter-spacing:.24em;padding-left:.24em}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font:500 12px/1 var(--display)}
.back{display:flex;align-items:center;gap:6px;height:44px;font:600 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase}
.back .ms{font-size:18px}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font:600 9.5px/1 var(--ui);letter-spacing:.16em;position:relative}
.nav button.on{color:var(--ink)}
.nav button.on::after{content:"";position:absolute;bottom:9px;width:16px;height:1px;background:var(--ink)}
.nav .ms{font-size:21px}

/* product cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px 12px}
.card{display:flex;flex-direction:column;gap:9px;text-align:left;cursor:pointer;min-width:0}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--tile);overflow:hidden}
.tile svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.1s var(--ease)}
.card:hover .tile svg{transform:scale(1.035)}
.tile .rv{animation:reveal 1.1s var(--ease) both}
@keyframes reveal{from{transform:scale(1.06);opacity:.4}to{transform:none;opacity:1}}
.heart{position:absolute;top:6px;right:6px;width:34px;height:34px;display:grid;place-items:center;color:#151311;z-index:2}
.heart .ms{font-size:20px;transition:transform .4s var(--ease)}
.heart.on .ms{font-variation-settings:'FILL' 1,'wght' 300,'opsz' 24}
.heart:active .ms{transform:scale(.85)}
.badge{position:absolute;top:0;left:0;z-index:2;background:#151311;color:#f6f3ee;font:600 9px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px}
.badge.lt{background:rgba(255,253,249,.92);color:#151311}
.badge.btm{top:auto;bottom:8px;left:8px}
.spons{position:absolute;top:8px;left:8px;z-index:2;font:500 9px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#5d554d}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.store{font:600 10px/1 var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.match{font-size:11px;color:var(--accent-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pname{font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{font-size:11.5px;color:var(--accent-ink)}
.carousel{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.carousel .card{width:164px;flex:none;scroll-snap-align:start}

/* art */
.art{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--art1),var(--art2))}
.art svg.fig{position:absolute;inset:0;width:100%;height:100%}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;background-image:radial-gradient(rgba(0,0,0,.25) .6px,transparent .7px);background-size:3px 3px}
.floatcard{position:absolute;left:16px;right:16px;bottom:16px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);padding:14px 16px;z-index:2}

/* splash */
.splash{position:relative;min-height:100%;display:flex;flex-direction:column}
.splash .art{flex:1;min-height:440px}
.splash .art svg{animation:slowzoom 6s var(--ease) both}
@keyframes slowzoom{from{transform:scale(1.08)}to{transform:none}}
.wordmark{font:400 46px/1 var(--display);letter-spacing:.32em;padding-left:.32em;animation:track 1.6s var(--ease) both}
@keyframes track{from{letter-spacing:.7em;opacity:0}to{letter-spacing:.32em;opacity:1}}
.splash-copy{position:absolute;left:0;right:0;bottom:30px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:2}

/* onboarding */
.bars{display:flex;gap:6px}
.bars i{height:2px;width:16px;background:var(--line);transition:width .5s var(--ease),background .5s}
.bars i.on{width:32px;background:var(--ink)}

/* forms */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:0 6px 0 14px;height:54px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14px}
.search input::placeholder{color:var(--muted)}
.search .ms{color:var(--muted)}

/* parse */
.line{height:1px;background:var(--line);position:relative;overflow:hidden}
.line::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--accent),var(--ink));transform:translateX(-100%);animation:draw 2.4s var(--ease) infinite}
@keyframes draw{to{transform:translateX(100%)}}
.panel{background:var(--surface);padding:16px}
.ul{margin:8px 0 0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* product */
.gal{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--tile);overflow:hidden}
.gal svg{position:absolute;inset:0;width:100%;height:100%}
.gal .prog{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:6px;z-index:3}
.gal .prog button{flex:1;height:14px;display:flex;align-items:center}
.gal .prog button i{display:block;height:2px;width:100%;background:rgba(21,19,17,.22)}
.gal .prog button.on i{background:#151311}
.gtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;padding:8px 10px;color:#151311}
.bar{height:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width 1.2s var(--ease)}
.quote{background:var(--surface);padding:16px 16px 16px 18px;box-shadow:inset 2px 0 0 var(--accent);font:italic 400 16px/1.5 var(--display)}
.rows>div{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);gap:10px}
.rows>div:first-child{border-top:1px solid var(--line)}
.sizes{display:flex;gap:6px}
.sizes button{width:44px;height:38px;box-shadow:inset 0 0 0 1px var(--line);font-size:12px;font-weight:500}
.sizes button.on{box-shadow:inset 0 0 0 1px var(--ink)}
.sizes button:disabled{color:var(--muted);text-decoration:line-through;cursor:default}
.tray{position:sticky;bottom:0;z-index:25;display:flex;gap:10px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--line)}
.tray .btn{height:48px}
svg.chart text{font:500 9.5px var(--ui);fill:var(--muted);letter-spacing:.08em}

/* camera / crop */
.cam{position:relative;min-height:100%;background:#0e0d0c;color:#f3eee6;display:flex;flex-direction:column}
.cam .view{position:relative;flex:1;min-height:420px;overflow:hidden}
.cam .view svg{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.reticle{position:absolute;inset:14% 13% 18%}
.reticle i{position:absolute;width:22px;height:22px;border-color:#f3eee6;border-style:solid;border-width:0}
.reticle i:nth-child(1){top:0;left:0;border-top-width:1.5px;border-left-width:1.5px}
.reticle i:nth-child(2){top:0;right:0;border-top-width:1.5px;border-right-width:1.5px}
.reticle i:nth-child(3){bottom:0;left:0;border-bottom-width:1.5px;border-left-width:1.5px}
.reticle i:nth-child(4){bottom:0;right:0;border-bottom-width:1.5px;border-right-width:1.5px}
.camtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.glass{background:rgba(14,13,12,.55);backdrop-filter:blur(8px);padding:8px 12px;font:600 10px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.console{background:#111;border-top:1px solid #2c2724;padding:22px 20px 26px}
.console .row{display:flex;justify-content:space-between;align-items:center;max-width:340px;margin:0 auto}
.camopt{display:flex;flex-direction:column;align-items:center;gap:8px;width:76px;font:600 9.5px/1 var(--ui);letter-spacing:.15em;color:rgba(243,238,230,.8);cursor:pointer}
.camopt span.box{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(243,238,230,.22)}
.shutter{width:76px;height:76px;padding:4px;border:2px solid rgba(243,238,230,.85)}
.shutter span{display:grid;place-items:center;width:100%;height:100%;background:#f3eee6;color:#111;font:700 10px/1 var(--ui);letter-spacing:.16em;transition:transform .2s}
.shutter:active span{transform:scale(.94)}
.camtabs{display:flex;justify-content:center;gap:22px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(243,238,230,.1)}
.camtabs button{font:600 9.5px/1 var(--ui);letter-spacing:.17em;color:rgba(243,238,230,.45);padding-bottom:4px}
.camtabs button.on{color:#f3eee6;box-shadow:inset 0 -1px 0 #f3eee6}
.cropview{position:relative;aspect-ratio:9/14;max-width:100%;overflow:hidden;background:#2a2622}
.cropview>svg,.cropview>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.det{position:absolute;cursor:pointer;z-index:2;transition:opacity .3s}
.det::before{content:"";position:absolute;inset:0;border:1.5px dashed rgba(198,165,116,.85);background:rgba(0,0,0,.08);transition:all .35s var(--ease)}
.det.on::before{border-style:solid;border-color:#c6a574;background:rgba(198,165,116,.08)}
.det.on::after{content:"";position:absolute;inset:-5px;background:
  linear-gradient(#c6a574,#c6a574) 0 0/10px 1.5px no-repeat,linear-gradient(#c6a574,#c6a574) 0 0/1.5px 10px no-repeat,
  linear-gradient(#c6a574,#c6a574) 100% 0/10px 1.5px no-repeat,linear-gradient(#c6a574,#c6a574) 100% 0/1.5px 10px no-repeat,
  linear-gradient(#c6a574,#c6a574) 0 100%/10px 1.5px no-repeat,linear-gradient(#c6a574,#c6a574) 0 100%/1.5px 10px no-repeat,
  linear-gradient(#c6a574,#c6a574) 100% 100%/10px 1.5px no-repeat,linear-gradient(#c6a574,#c6a574) 100% 100%/1.5px 10px no-repeat}
.det b{position:absolute;top:-22px;left:0;font:600 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;background:rgba(255,253,249,.92);color:#151311;padding:5px 7px;white-space:nowrap}
.det.on b{background:#c6a574;color:#151311}
.sheet{background:var(--surface);padding:14px 20px 26px;position:relative}
.grab{width:34px;height:2px;background:var(--line);margin:0 auto 16px}
.selcard{display:flex;gap:14px;align-items:center;background:var(--bg);padding:12px}
.selcard .tile{width:58px;flex:none}

/* tabs / segmented */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);box-shadow:inset 0 -1px 0 var(--line)}
.tabs button{height:46px;font:600 10.5px/1 var(--ui);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);animation:grow .45s var(--ease)}
@keyframes grow{from{transform:scaleX(.3)}to{transform:none}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);padding:3px}
.seg button{height:40px;font:600 10.5px/1 var(--ui);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;transition:background .35s,color .35s}
.seg button.on{background:var(--ink);color:var(--on-ink)}

/* wishlist / gifts */
.feature{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.listrow{display:flex;gap:14px;align-items:center;background:var(--surface);padding:12px;text-align:left;width:100%}
.listrow .tile{width:64px;flex:none}
.reserved .tile svg{filter:grayscale(.5) blur(1.5px);opacity:.6}
.reserved .pname{text-decoration:line-through;color:var(--muted)}
.dim{background:var(--surface2);color:var(--muted)}
.dim:active{transform:none;opacity:1}
.overlay{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0}}
.overlay .sheet{width:100%;max-height:92%;overflow:auto;animation:up .55s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.channel{display:flex;align-items:center;gap:12px;background:var(--bg);padding:12px;width:100%;text-align:left}
.channel .ic{width:40px;height:40px;display:grid;place-items:center;background:var(--surface);flex:none}
.channel small{display:block;color:var(--muted);font-size:12px}

/* looks */
.board{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--line)}
.board .tile{aspect-ratio:1}
.budget{background:var(--surface2);padding:14px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);padding:12px 12px 12px 14px}

/* alerts */
.alert{background:var(--surface);display:flex;flex-direction:column}
.alert .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font:600 10px/1 var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--muted);box-shadow:inset 0 -1px 0 var(--line)}
.alert.hit .top{background:var(--ink);color:var(--accent);box-shadow:none}
.alert .body{display:flex;gap:14px;padding:14px}
.alert .body .tile{width:84px;flex:none}
.stepper{display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.stepper button{width:32px;height:30px;display:grid;place-items:center}
.stepper span{min-width:76px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .3s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.toggle.on{background:var(--ink)}
.toggle.on::after{transform:translateX(18px);background:var(--on-ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);padding:15px 16px}
.setrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* lock screen */
.lock{min-height:100%;position:relative;color:#f6f1ea;background:radial-gradient(120% 70% at 30% 10%,#6b5a48,#2a221c 55%,#141110);display:flex;flex-direction:column;align-items:center;padding:34px 16px 30px}
.lock .time{font:300 84px/1 var(--display);letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.push{width:100%;margin-top:36px;background:rgba(250,246,240,.88);color:#151311;border-radius:22px;padding:14px;backdrop-filter:blur(20px);animation:drop .9s var(--ease) .3s both}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.97)}}
.push .appic{width:26px;height:26px;border-radius:7px;background:#151311;color:#f6f1ea;display:grid;place-items:center;font:italic 500 14px/1 var(--display)}
.push .btn{border-radius:12px;height:40px}

/* pro */
.pro .art{aspect-ratio:3/4;max-width:100%;background:linear-gradient(170deg,#3a2f26,#141110)}
.pro .art svg{position:absolute;inset:0;width:100%;height:100%}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ic{width:40px;height:40px;display:grid;place-items:center;background:var(--surface2);flex:none}

/* misc */
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:60;background:var(--ink);color:var(--on-ink);padding:14px 16px;font-size:13px;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.toast.show{transform:none;opacity:1}
.toast .ms{color:var(--accent);font-size:18px}
.fab{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:70;height:30px;padding:0 10px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--line);font:600 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.fab .ms{font-size:15px}
.mapsheet .sheet button{display:flex;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.mapsheet .sheet button b{width:22px;color:var(--muted);font-weight:500;font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- query parsing ---------- */
function parseQuery(q){
  const t=q.toLowerCase(); const r={cat:null,catLabel:null,color:null,attrs:[],budget:null,chips:[]};
  for(const [re,c,l] of CATS){if(re.test(t)){r.cat=c;r.catLabel=l;break}}
  for(const [re,c] of COLORS){if(re.test(t)){r.color=c;break}}
  for(const [re,a] of ATTRS){if(re.test(t))r.attrs.push(a)}
  const m=t.match(/до\s*([\d\s ]{3,})/); if(m){const v=parseInt(m[1].replace(/\D/g,""),10); if(v>200)r.budget=v}
  if(r.cat)r.chips.push({k:"cat",l:r.catLabel});
  if(r.color)r.chips.push({k:"color",l:r.color[0].toUpperCase()+r.color.slice(1)});
  r.attrs.forEach(a=>r.chips.push({k:"a:"+a,l:a[0].toUpperCase()+a.slice(1)}));
  if(r.budget)r.chips.push({k:"budget",l:"до "+fmt(r.budget)});
  return r;
}
function scoreP(p,r){
  let s=70; if(r.cat&&p.cat===r.cat)s+=10; if(r.color&&p.color===r.color)s+=7;
  r.attrs.forEach(a=>{if(p.attrs.includes(a))s+=4});
  s+=hashN(p.id)%4; return Math.min(97,s);
}
function search(){
  const r=parseQuery(S.query), rm=S.removed;
  const eff={cat:rm.has("cat")?null:r.cat,color:rm.has("color")?null:r.color,attrs:r.attrs.filter(a=>!rm.has("a:"+a)),budget:rm.has("budget")?null:r.budget};
  let list=P.filter(p=>(!eff.cat||p.cat===eff.cat));
  if(eff.color){const c=list.filter(p=>p.color===eff.color||(eff.color==="голубой"&&p.color==="синий"));if(c.length)list=c}
  let over=false;
  if(eff.budget){const b=list.filter(p=>p.price<=eff.budget); if(b.length)list=b; else over=true}
  if(!eff.cat&&!eff.color&&!eff.attrs.length&&!eff.budget&&!r.cat)list=P.slice(0,8);
  list=list.map(p=>({p,m:scoreP(p,eff)}));
  list.sort(S.sort==="price"?(a,b)=>a.p.price-b.p.price:(a,b)=>b.m-a.m);
  const min=Math.min(...list.map(x=>x.p.price));
  return {r,list,min,over,stores:new Set(list.map(x=>x.p.store)).size};
}

function photoSet(){

  return P.filter(p=>p.cat===c);
}
V.photo=()=>{
  const items=photoSet(), look=!S.upload&&S.cropSel==="look";
  const label=look?"Весь образ: тренч, брюки, сумка":S.upload?({coat:"Тренч или пальто",jeans:"Джинсы",dress:"Платье",trousers:"Брюки",bag:"Сумка"}[S.upCat]):DET[S.cropSel].n;
  const ranked=items.map((p,i)=>({p,m:96-((hashN(p.id)+i*2)%9)})).sort((a,b)=>b.m-a.m);
  const top=ranked[0];
  let list=ranked.slice();
  if(S.photoTab==="cheap")list.sort((a,b)=>a.p.price-b.p.price);
  if(S.photoTab==="quality")list.sort((a,b)=>b.p.q-a.p.q||b.m-a.m);
  const min=Math.min(...list.map(x=>x.p.price));
  const note=x=>S.photoTab==="cheap"?(x.p.price<top.p.price?`дешевле самого похожего на ${fmt(top.p.price-x.p.price)}`:x===top?"самое похожее":""):S.photoTab==="quality"?x.p.mat:"";
  return `<div class="scr">${header()}${backbar("Назад",`<span class="eyebrow acc">${ms("check_circle")} Распознано</span>`)}

/* ---------- render / navigation ---------- */
const scroll=document.getElementById("scroll"), chrome=document.getElementById("chrome");
let timers=[];
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function render(keepScroll){
  clearTimers();
  const top=scroll.scrollTop;
  scroll.innerHTML=V[S.route]();
  const nav=navbar(); chrome.innerHTML=nav; scroll.classList.toggle("has-nav",!!nav);
  scroll.scrollTop=keepScroll?top:0;
  if(!keepScroll)scroll.querySelector(".scr")?.style.removeProperty("animation");
  else scroll.querySelector(".scr").style.animation="none";
  post(); renderMap();
}
function post(){
  requestAnimationFrame(()=>scroll.querySelectorAll(".bar i[data-w]").forEach(b=>b.style.width=b.dataset.w+"%"));
  if(S.route==="parse"){
    const n=search().list.length, el=document.getElementById("cnt"); let i=0;
    const step=()=>{if(!el)return; i++; el.textContent=Math.round(n*Math.min(1,i/20)); if(i<20)timers.push(setTimeout(step,45))};
    timers.push(setTimeout(step,500)); timers.push(setTimeout(()=>{if(S.route==="parse")go("results",true)},3200));
  }
}
function go(r,replace){
  if(!V[r])return;
  if(r==="looks"&&S.route!=="looks")S.lookItems=null;
  if(!replace&&S.route!==r)S.hist.push(S.route);
  S.route=r; try{history.replaceState(null,"","#"+r)}catch(e){}
  render();
}
function back(){const r=S.hist.pop()||"home"; S.route=r; try{history.replaceState(null,"","#"+r)}catch(e){} render()}
function toast(t,icon="check"){const el=document.getElementById("toast");el.querySelector(".ms").textContent=icon;document.getElementById("toastText").textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600)}
function renderMap(){
  let html=`<h2>FINDLY</h2><p>Кликабельный прототип · 20 экранов</p>`;
  SCREENS.forEach(([k,l,g],i)=>{if(g)html+=`<div class="grp">${g}</div>`;html+=`<button data-jump="${k}" class="${S.route===k?"on":""}" type="button"><b>${String(i+1).padStart(2,"0")}</b>${l}</button>`});
  document.getElementById("map").innerHTML=html;
}
function openMapSheet(){
  const o=document.createElement("div"); o.className="overlay mapsheet";
  o.innerHTML=`<div class="sheet"><div class="grab"></div><div class="between"><h2 class="h2">Экраны</h2><button class="iconbtn" data-close type="button" aria-label="Закрыть">${ms("close")}</button></div>
  <div class="mt12">${SCREENS.map(([k,l],i)=>`<button data-jump="${k}" type="button"><b>${String(i+1).padStart(2,"0")}</b>${l}</button>`).join("")}</div></div>`;
  document.getElementById("phone").appendChild(o);
  o.addEventListener("click",e=>{if(e.target===o||e.target.closest("[data-close]")||e.target.closest("[data-jump]"))o.remove()});
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-jump],[data-go],[data-back],[data-wish],[data-pid],[data-act],[data-q],[data-chip],[data-view],[data-size],[data-camcat],[data-det],[data-upcat],[data-ptab],[data-wtab],[data-occ],[data-gf],[data-gift],[data-look],[data-swap],[data-untrack],[data-tgt],[data-unlink],[data-style],[data-fav],.overlay[data-back-overlay]");
  if(!t)return;
  const d=t.dataset;
  if(t.matches(".overlay[data-back-overlay]")){if(e.target===t)back();return}
  if(d.jump){S.hist=[];go(d.jump,true);return}
  if(d.wish){e.stopPropagation();const on=!S.wish.has(d.wish);on?S.wish.add(d.wish):S.wish.delete(d.wish);saveWish();
    t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);toast(on?"Добавлено в вишлист":"Убрано из вишлиста",on?"favorite":"check");
    if(S.route==="wishlist")render(true);return}
  if(d.go){go(d.go);return}
  if(t.hasAttribute("data-back")){back();return}
  if(d.pid){S.pid=d.pid;S.view=0;go("product");return}
  if(d.q){if(/образ/i.test(d.q)){go("looks");return}S.query=d.q;S.removed=new Set();go("parse");return}
  if(d.chip){S.removed.has(d.chip)?S.removed.delete(d.chip):S.removed.add(d.chip);render(true);return}
  if(d.view){S.view=+d.view;render(true);return}
  if(d.size){S.size=d.size;render(true);return}
  if(d.camcat){S.camCat=d.camcat;render(true);return}
  if(d.det){S.cropSel=d.det;render(true);return}
  if(d.upcat){S.upCat=d.upcat;render(true);return}
  if(d.ptab){S.photoTab=d.ptab;render(true);return}
  if(d.wtab){S.wishTab=d.wtab;render(true);return}
  if(d.occ){S.occasion=d.occ;render(true);return}
  if(d.gf){S.guestFilter=d.gf;render(true);return}
  if(d.gift){S.reserved.add(d.gift);S.giftId=d.gift;go("gifted");return}
  if(d.look){S.look=d.look;S.lookItems=LOOKS[d.look].items.slice();render(true);return}
  if(d.swap){const i=+d.swap,cur=S.lookItems[i],alt=ALTS[cur];
    if(!alt||S.lookItems.includes(alt)){toast("Другой похожей вещи пока нет","info");return}
    S.lookItems[i]=alt;render(true);toast("Заменили на «"+byId[alt].name+"»","sync_alt");return}
  if(d.untrack){S.tracked.delete(d.untrack);saveTracked();render(true);return}
  if(d.tgt){const v=Math.max(100,S.tracked.get(d.tgt)+(+d.d));S.tracked.set(d.tgt,v);saveTracked();render(true);return}
  if(d.unlink){S.links.splice(+d.unlink,1);store.set("links",S.links);render(true);return}
  if(d.style){S.styles.has(d.style)?S.styles.delete(d.style):S.styles.add(d.style);render(true);return}
  if(d.fav){S.favStores.has(d.fav)?S.favStores.delete(d.fav):S.favStores.add(d.fav);render(true);return}
  if(d.act){
    switch(d.act){
      case "track":{const p=byId[S.pid];if(S.tracked.has(p.id)){S.tracked.delete(p.id);toast("Больше не следим за ценой","notifications_off")}else{S.tracked.set(p.id,Math.round(p.price*.85/100)*100);toast("Напишем, когда цена упадёт до "+fmt(S.tracked.get(p.id)),"notifications_active")}saveTracked();render(true);break}
      case "share-item":{const p=byId[S.pid];copy(`${p.name} — ${fmt(p.price)} в ${p.store}. Нашла на FINDLY`,"Описание вещи скопировано");break}
      case "shoot":S.upload=null;S.cropSel=S.camCat==="bag"?"bag":S.camCat==="shoes"?"trousers":"coat";go("crop");break;
      case "find-similar":S.photoTab="similar";go("photo");break;
      case "find-look":S.cropSel="look";S.photoTab="similar";go("photo");break;
      case "copy":copy(d.copy,"Ссылка скопирована");break;
      case "unreserve":S.reserved.delete(S.giftId);toast("Бронь отменена","undo");go("guest");break;
      case "save-look":toast("Образ сохранён","bookmark");break;
      case "tg":S.tg=!S.tg;toast(S.tg?"Telegram подключён (в прототипе сообщения не приходят)":"Telegram отключён","send");render(true);break;
      case "addlink":S.addLink=true;render(true);setTimeout(()=>document.getElementById("lnk")?.focus(),50);break;
      case "budget":S.budget=Math.max(1000,S.budget+(+d.d));render(true);break;
      case "onlyhigh":S.onlyHigh=!S.onlyHigh;render(true);break;
      case "open-push":S.pid="j1";go("product");break;
      case "pro":S.proOpen=true;render(true);break;
    }
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const c=e.target.closest&&e.target.closest(".card[data-pid]");if(c){S.pid=c.dataset.pid;S.view=0;go("product")}}});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="home-search"){const v=document.getElementById("q").value.trim();if(!v){document.getElementById("q").focus();return}
    if(/образ/i.test(v)&&!/джинс|плать|тренч|пальто|брюк/i.test(v)){go("looks");return}
    S.query=v;S.removed=new Set();S.sort="match";go("parse")}
  if(e.target.id==="look-form"){const v=document.getElementById("lq").value.toLowerCase(),m=v.match(/до\s*([\d\s ]{3,})/);
    if(m)S.budget=Math.max(1000,parseInt(m[1].replace(/\D/g,""),10)||S.budget);
    S.look=/офис|работ/.test(v)?"office":/друз|ужин|выходн/.test(v)?"friends":"date";S.lookItems=LOOKS[S.look].items.slice();render(true)}
  if(e.target.id==="link-form"){const v=document.getElementById("lnk").value.trim();let host="";try{host=new URL(v).hostname.replace(/^www\./,"")}catch(err){toast("Похоже, это не ссылка. Скопируйте адрес товара целиком","error");return}
    S.links.push({url:v,host});store.set("links",S.links);S.addLink=false;render(true);toast("Следим за ценой по ссылке","notifications_active")}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sort"){S.sort=e.target.value;render(true)}
  if(e.target.dataset.sizekey){S.sizes[e.target.dataset.sizekey]=e.target.value;toast("Размер сохранён")}
  if(e.target.id==="file"){const f=e.target.files&&e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{S.upload=rd.result;S.upCat="coat";go("crop")};rd.onerror=()=>toast("Не получилось открыть фото, попробуйте другое","error");rd.readAsDataURL(f)}
});
function copy(text,msg){
  const done=()=>toast(msg);
  try{navigator.clipboard.writeText(text).then(done,()=>toast("Скопируйте вручную: "+text,"content_copy"))}catch(e){toast("Скопируйте вручную: "+text,"content_copy")}
}
document.getElementById("fab").addEventListener("click",openMapSheet);

/* boot */
const start=(location.hash||"").slice(1);
S.route=V[start]?start:"splash";
if(["product","results","parse","photo","share","gifted"].includes(S.route))S.hist=["home"];
render();
})();
</script>

</body>
</html>
