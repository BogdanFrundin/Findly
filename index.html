<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FINDLY</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..400,0..1,0&display=block">
<style>
/* Layout: clickable phone mockup with a screen map; single brand theme — Ivory ground, Espresso text, Burgundy actions, Champagne hairlines; one serif throughout */
:root{
  --ivory:#F6F0E8; --paper:#FBF7F1; --sand:#EEE5D8; --tile:#E8DECF;
  --esp:#35251F; --muted:#7A6A60; --line:#E3D7C7;
  --bur:#591E2B; --bur2:#6E2736; --champ:#C6A779; --champ-ink:#8A6B43;
  --on-bur:#F6F0E8; --stage:#E7DFD3; --scrim:rgba(53,37,31,.5);
  --serif:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--esp);font:500 17px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1.5px solid var(--champ);outline-offset:2px}
.ms{font-family:"Material Symbols Outlined";font-weight:300;font-size:21px;line-height:1;font-variation-settings:'FILL' 0,'wght' 300,'opsz' 24;display:inline-block;vertical-align:middle;user-select:none;flex:none;width:1em;overflow:hidden;white-space:nowrap}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 300,'opsz' 24}

/* stage */
.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:56px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.map{display:none}
.phone{position:relative;width:100%;height:100%;background:var(--ivory);overflow:hidden}
@media (min-width:980px){
  .stage{padding-block:28px}
  .phone{width:390px;height:min(844px,100%);border-radius:46px;box-shadow:0 0 0 10px #241915,0 30px 80px rgba(53,37,31,.3)}
  .map{display:flex;flex-direction:column;gap:1px;width:250px;max-height:100%;overflow:auto;scrollbar-width:none}
  .fab{display:none!important}
}
.map h2{font:500 30px/1 var(--serif);letter-spacing:.24em;margin:0 0 6px}
.map p{margin:0 0 14px;color:var(--muted);font-size:15px;font-style:italic}
.map button{display:flex;gap:10px;align-items:baseline;padding:5px 10px;font-size:16px;color:var(--muted)}
.map button b{font-weight:600;font-size:12px;width:20px;color:var(--champ-ink);font-variant-numeric:tabular-nums}
.map button:hover{color:var(--esp)}
.map button.on{color:var(--esp);background:var(--paper)}
.map .grp{margin:12px 0 2px 10px;font:600 11px/1 var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--bur)}

.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{display:none}
.scroll.has-nav{padding-bottom:76px}
.scr{min-height:100%;animation:enter .65s var(--ease) both}
.calm .scr{animation:none}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.pad{padding-inline:20px}

/* type */
.eyebrow{font:600 11.5px/1.3 var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.eyebrow.acc{color:var(--champ-ink)}
.eyebrow.bur{color:var(--bur)}
.eyebrow.ink{color:var(--esp)}
.h1{font:500 38px/1.04 var(--serif);letter-spacing:-.005em;margin:0;text-wrap:balance}
.h1 i,.h2 i{font-style:italic;color:var(--bur)}
.h2{font:500 28px/1.1 var(--serif);margin:0;text-wrap:balance}
.h3{font:600 21px/1.2 var(--serif);margin:0}
.lead{color:var(--muted);margin:0;font-size:18px;line-height:1.5}
.small{font-size:15px}
.muted{color:var(--muted)}
.num,.price{font-variant-numeric:lining-nums tabular-nums}
.price{font-weight:600}
.old{color:var(--muted);text-decoration:line-through;font-size:14px;font-variant-numeric:lining-nums tabular-nums}
.note{font-size:14px;color:var(--champ-ink);font-style:italic}

/* controls */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;padding:0 22px;background:var(--bur);color:var(--on-bur);font:600 12.5px/1 var(--serif);letter-spacing:.2em;text-transform:uppercase;width:100%;transition:background .3s,transform .3s var(--ease),opacity .3s}
.btn:hover{background:var(--bur2)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;color:var(--esp);box-shadow:inset 0 0 0 1px var(--esp)}
.btn.ghost:hover{background:var(--esp);color:var(--ivory)}
.btn.line{background:transparent;color:var(--bur);box-shadow:inset 0 0 0 1px var(--champ)}
.btn.line:hover{background:var(--sand)}
.btn.esp{background:var(--esp)}
.btn.light{background:var(--ivory);color:var(--esp)}
.btn.sm{height:38px;font-size:11px;padding:0 14px;width:auto}
.btn .ms{font-size:18px}
.link{font:600 12px/1 var(--serif);letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--champ);padding-bottom:4px;color:var(--bur)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;box-shadow:inset 0 0 0 1px var(--line);font:600 12px/1 var(--serif);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;background:var(--paper);transition:background .3s,color .3s,box-shadow .3s}
.chip:hover{box-shadow:inset 0 0 0 1px var(--champ)}
.chip.on{background:var(--esp);color:var(--ivory);box-shadow:none}
.chip .ms{font-size:15px;opacity:.75}
.chip.parse{opacity:0;animation:rise .5s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hair{height:1px;background:var(--line);border:0;margin:0}
.rule{width:44px;height:1px;background:var(--champ)}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;position:relative}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:36px 0 14px}
.stack{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* header + nav */
.hdr{position:sticky;top:0;z-index:20;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-inline:8px 14px;background:color-mix(in srgb,var(--ivory) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.hdr.over{position:absolute;left:0;right:0;top:0;background:linear-gradient(rgba(30,18,15,.55),transparent);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;color:var(--ivory)}
.logo{font:500 23px/1 var(--serif);letter-spacing:.32em;padding-left:.32em}
.hdr .right{display:flex;justify-content:flex-end;align-items:center}
.signin{font:600 12px/1 var(--serif);letter-spacing:.18em;text-transform:uppercase;padding:9px 0;border-bottom:1px solid var(--champ)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--bur);color:var(--ivory);display:grid;place-items:center;font:500 16px/1 var(--serif)}
.hdr.over .avatar{background:var(--ivory);color:var(--bur)}
.citybar{display:flex;justify-content:center;gap:6px;align-items:center;background:var(--esp);color:var(--ivory);font:500 13px/1 var(--serif);letter-spacing:.1em;padding:8px 12px}
.citybar button{border-bottom:1px solid rgba(198,167,121,.7)}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;height:68px;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--ivory) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);font:600 11px/1 var(--serif);letter-spacing:.16em;position:relative}
.nav button.on{color:var(--bur)}
.nav button.on::after{content:"";position:absolute;bottom:9px;width:18px;height:1px;background:var(--champ)}
.nav .ms{font-size:21px}
.nav .cnt{position:absolute;top:9px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bur);color:var(--ivory);font:600 10px/16px var(--serif);text-align:center;padding:0 4px}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 12px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.card .open{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.tile{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--tile);overflow:hidden}
.tile>svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.2s var(--ease)}
.card:hover .tile>svg{transform:scale(1.04)}
.rv{animation:reveal 1.1s var(--ease) both}
.calm .rv{animation:none}
@keyframes reveal{from{transform:scale(1.06);opacity:.35}}
.heart{position:absolute;top:6px;right:6px;width:36px;height:36px;display:grid;place-items:center;color:var(--esp);z-index:2}
.heart .ms{font-size:20px;transition:transform .45s var(--ease)}
.heart.on{color:var(--bur)}
.heart.on .ms{font-variation-settings:'FILL' 1,'wght' 300,'opsz' 24}
.heart:active .ms{transform:scale(.82)}
.badge{position:absolute;top:0;left:0;z-index:2;background:var(--bur);color:var(--ivory);font:600 10px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;padding:6px 8px}
.badge.lt{background:rgba(251,247,241,.94);color:var(--esp)}
.badge.btm{top:auto;bottom:8px;left:8px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.store{font:600 11px/1 var(--serif);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.match{font-size:13px;color:var(--champ-ink);font-style:italic;white-space:nowrap}
.pname{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.addcart{height:34px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 0 0 1px var(--champ);font:600 11px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--bur);transition:background .3s,color .3s}
.addcart:hover{background:var(--sand)}
.addcart.in{background:var(--bur);color:var(--ivory);box-shadow:none}
.addcart .ms{font-size:16px}
.carousel{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;scrollbar-width:none;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.carousel .card{width:166px;flex:none;scroll-snap-align:start}

/* landing hero */
.hero{position:relative;height:640px;max-height:92vh;min-height:520px;overflow:hidden;background:#2a1b17;color:var(--ivory)}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.6s var(--ease)}
.scene.on{opacity:1}
.scene svg{position:absolute;inset:0;width:100%;height:100%;transform:scale(1.08);transition:transform 7s linear}
.scene.on svg{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,15,.15) 0%,transparent 35%,rgba(30,18,15,.78) 78%);pointer-events:none}
.hero .copy{position:absolute;left:0;right:0;bottom:34px;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-inline:24px}
.wordmark{font:500 54px/1 var(--serif);letter-spacing:.3em;padding-left:.3em;animation:track 1.8s var(--ease) both}
@keyframes track{from{letter-spacing:.7em;opacity:0}to{letter-spacing:.3em;opacity:1}}
.hero .tag{font-style:italic;font-size:20px;opacity:.92;animation:rise 1s var(--ease) .5s both}
.hero .ctas{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:10px;animation:rise 1s var(--ease) .7s both}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:18px;height:1px;background:rgba(246,240,232,.4);transition:background .6s,width .6s var(--ease)}
.dots i.on{width:30px;background:var(--champ)}
.calm .wordmark,.calm .hero .tag,.calm .hero .ctas{animation:none}

/* landing sections */
.block{padding-block:52px 8px}
.story{background:var(--esp);color:var(--ivory);padding-block:52px;margin-top:52px}
.story .lead{color:rgba(246,240,232,.78)}
.story .eyebrow{color:var(--champ)}
.story .h1 i{color:var(--champ)}
.quote{font:italic 500 22px/1.35 var(--serif);margin:0;padding-left:16px;box-shadow:inset 1px 0 0 var(--champ)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;padding-block:18px;border-bottom:1px solid var(--line)}
.step:first-child{border-top:1px solid var(--line)}
.step .n{grid-row:span 2;font:500 34px/1 var(--serif);color:var(--champ-ink);font-variant-numeric:lining-nums}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.caps>div{background:var(--ivory);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.caps .ms{color:var(--bur);font-size:22px}
.pro-tag{font:600 10px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;color:var(--champ-ink)}
.foot{background:var(--esp);color:var(--ivory);padding-block:40px 34px;margin-top:48px}
.foot .eyebrow{color:var(--champ)}
.foot .rows{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.foot .rows>div{display:flex;justify-content:space-between;gap:12px;padding-block:11px;border-bottom:1px solid rgba(198,167,121,.25);font-size:16px}
.foot .rows span:first-child{color:rgba(246,240,232,.6)}
.foot .copy{user-select:all}

/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:0 6px 0 14px;height:56px;transition:box-shadow .3s}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--champ)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:17px}
.search input::placeholder{color:var(--muted);font-style:italic}
.search>.ms{color:var(--muted)}
.line{height:1px;background:var(--line);position:relative;overflow:hidden}
.line::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--champ),var(--bur));transform:translateX(-100%);animation:draw 2.2s var(--ease) infinite}
@keyframes draw{to{transform:translateX(100%)}}
.panel{background:var(--paper);padding:16px}
.panel.sand{background:var(--sand)}

/* product */
.gal{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--tile);overflow:hidden}
.gal>svg{position:absolute;inset:0;width:100%;height:100%}
.gal .prog{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:6px;z-index:3}
.gal .prog button{flex:1;height:14px;display:flex;align-items:center}
.gal .prog button i{display:block;height:1px;width:100%;background:rgba(53,37,31,.25)}
.gal .prog button.on i{height:2px;background:var(--bur)}
.gtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;padding:8px 10px;color:var(--esp)}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes button{min-width:46px;height:42px;padding:0 10px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;font-weight:600;background:var(--paper)}
.sizes button.on{box-shadow:inset 0 0 0 1.5px var(--bur);color:var(--bur)}
.sizes button:disabled{color:var(--muted);text-decoration:line-through;cursor:default;opacity:.6}
.rows>div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:10px}
.rows>div:first-child{border-top:1px solid var(--line)}
.tray{position:sticky;bottom:0;z-index:25;display:flex;gap:8px;padding:12px 20px;background:color-mix(in srgb,var(--ivory) 95%,transparent);backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--line)}
.tray .btn{height:48px}
.tray .sq{width:48px;flex:none;padding:0}
table.sz{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:lining-nums tabular-nums}
table.sz th{font:600 11px/1.2 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.sz td{padding:10px 6px;border-bottom:1px solid var(--line)}
table.sz tr.on td{color:var(--bur);font-weight:600}

/* chat (assistant & looks) */
.chat{display:flex;flex-direction:column;gap:14px;padding:16px 20px 120px}
.msg{max-width:88%;padding:12px 15px;font-size:17px;line-height:1.4;animation:rise .5s var(--ease) both}
.msg.ai{align-self:flex-start;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.msg.me{align-self:flex-end;background:var(--esp);color:var(--ivory)}
.msg.wide{max-width:100%;width:100%;padding:0;background:none;box-shadow:none}
.who{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--serif);letter-spacing:.18em;text-transform:uppercase;color:var(--champ-ink);margin-bottom:6px}
.who i{width:20px;height:20px;border-radius:50%;background:var(--bur);color:var(--ivory);display:grid;place-items:center;font:italic 600 12px/1 var(--serif)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--champ);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:absolute;left:0;right:0;bottom:68px;z-index:26;padding:10px 14px;background:color-mix(in srgb,var(--ivory) 95%,transparent);backdrop-filter:blur(12px);box-shadow:0 -1px 0 var(--line)}
.composer form{display:flex;gap:8px;align-items:center;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);padding:4px 4px 4px 14px}
.composer input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:17px}
.composer input::placeholder{font-style:italic;color:var(--muted)}
.send{width:42px;height:42px;display:grid;place-items:center;background:var(--bur);color:var(--ivory)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{width:150px;flex:none}
.board{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--line)}
.board .tile{aspect-ratio:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);padding:12px 12px 12px 14px}

/* camera / crop */
.cam{position:relative;min-height:100%;background:#1c1411;color:#f6f0e8;display:flex;flex-direction:column}
.cam .view{position:relative;flex:1;min-height:430px;overflow:hidden}
.cam .view svg{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.reticle{position:absolute;inset:14% 13% 18%}
.reticle i{position:absolute;width:22px;height:22px;border-color:#c6a779;border-style:solid;border-width:0}
.reticle i:nth-child(1){top:0;left:0;border-top-width:1.5px;border-left-width:1.5px}
.reticle i:nth-child(2){top:0;right:0;border-top-width:1.5px;border-right-width:1.5px}
.reticle i:nth-child(3){bottom:0;left:0;border-bottom-width:1.5px;border-left-width:1.5px}
.reticle i:nth-child(4){bottom:0;right:0;border-bottom-width:1.5px;border-right-width:1.5px}
.camtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(rgba(20,12,10,.6),transparent)}
.glass{background:rgba(28,20,17,.55);backdrop-filter:blur(8px);padding:8px 12px;font:600 11px/1 var(--serif);letter-spacing:.16em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;color:#f6f0e8}
.console{background:#1c1411;border-top:1px solid #3a2a24;padding:22px 20px 26px}
.console .row{display:flex;justify-content:space-between;align-items:center;max-width:340px;margin:0 auto}
.camopt{display:flex;flex-direction:column;align-items:center;gap:8px;width:76px;font:600 10.5px/1 var(--serif);letter-spacing:.15em;color:rgba(246,240,232,.8)}
.camopt span.box{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(198,167,121,.4)}
.shutter{width:76px;height:76px;padding:4px;border:1.5px solid #c6a779}
.shutter span{display:grid;place-items:center;width:100%;height:100%;background:#f6f0e8;color:#35251f;font:700 11px/1 var(--serif);letter-spacing:.16em;transition:transform .2s}
.shutter:active span{transform:scale(.94)}
.cropview{position:relative;aspect-ratio:9/14;max-width:100%;overflow:hidden;background:#2a2622}
.cropview>svg,.cropview>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.det{position:absolute;cursor:pointer;z-index:2}
.det::before{content:"";position:absolute;inset:0;border:1.5px dashed rgba(198,167,121,.9);background:rgba(0,0,0,.06);transition:all .35s var(--ease)}
.det.on::before{border-style:solid;border-color:#c6a779;background:rgba(198,167,121,.12)}
.det b{position:absolute;top:-22px;left:0;font:600 10.5px/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;background:rgba(251,247,241,.94);color:#35251f;padding:5px 7px;white-space:nowrap}
.det.on b{background:#c6a779}
.sheet{background:var(--paper);padding:14px 20px 26px;position:relative}
.grab{width:34px;height:2px;background:var(--line);margin:0 auto 16px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);box-shadow:inset 0 -1px 0 var(--line)}
.tabs.two{grid-template-columns:1fr 1fr}
.tabs button{height:46px;font:600 12px/1 var(--serif);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;position:relative}
.tabs button.on{color:var(--bur)}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--bur);animation:grow .45s var(--ease)}
@keyframes grow{from{transform:scaleX(.3)}}

/* wishlist & gifts & cart */
.feature{background:var(--paper);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 1px var(--line)}
.listrow{display:flex;gap:14px;align-items:center;background:var(--paper);padding:12px;text-align:left;width:100%}
.listrow .tile{width:64px;flex:none}
.chosen .tile>svg{filter:grayscale(.5) blur(1.5px);opacity:.55}
.chosen .pname{text-decoration:line-through;color:var(--muted)}
.dim{background:var(--sand);color:var(--muted);cursor:default}
.dim:hover{background:var(--sand)}
.field{display:flex;gap:8px;align-items:center;background:var(--ivory);box-shadow:inset 0 0 0 1px var(--line);padding:4px 4px 4px 14px}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:17px;height:42px}
.field input::placeholder{font-style:italic;color:var(--muted)}
.storegrp{background:var(--paper);display:flex;flex-direction:column}
.storegrp .head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.cartrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cartrow .tile{width:58px;flex:none}

/* account */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--paper);padding:15px 16px}
.setrow small{display:block;color:var(--muted);font-size:14px;margin-top:2px;font-style:italic}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .3s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.toggle.on{background:var(--bur)}
.toggle.on::after{transform:translateX(18px)}
.stepper{display:inline-flex;align-items:center;box-shadow:inset 0 0 0 1px var(--line);background:var(--paper)}
.stepper button{width:32px;height:30px;display:grid;place-items:center}
.stepper span{min-width:80px;text-align:center;font-size:15px;font-variant-numeric:lining-nums tabular-nums}
.alert{background:var(--paper);display:flex;flex-direction:column}
.alert .top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font:600 11px/1 var(--serif);letter-spacing:.15em;text-transform:uppercase;color:var(--muted);box-shadow:inset 0 -1px 0 var(--line)}
.alert.hit .top{background:var(--bur);color:var(--ivory);box-shadow:none}
.alert .body{display:flex;gap:14px;padding:14px}
.alert .body .tile{width:80px;flex:none}
.tgmsg{background:var(--sand);padding:12px 14px;border-radius:4px 16px 16px 16px;font-size:16px}
.tgbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.tgbtns span{background:var(--sand);text-align:center;padding:9px;font-size:15px;border-radius:8px}
.tgava{width:38px;height:38px;border-radius:50%;background:var(--bur);color:var(--ivory);display:grid;place-items:center;font:italic 600 19px/1 var(--serif);flex:none}
.prohero{position:relative;aspect-ratio:3/4;max-width:100%;overflow:hidden;background:linear-gradient(170deg,#5a2430,#24150f)}
.prohero>svg{position:absolute;inset:0;width:100%;height:100%}
.feat{display:flex;gap:14px;align-items:flex-start}
.feat .ic{width:42px;height:42px;display:grid;place-items:center;background:var(--sand);flex:none;color:var(--bur)}

/* modals */
#mlayer{position:absolute;inset:0;z-index:80;pointer-events:none}
#mlayer>*{pointer-events:auto}
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0}}
.overlay>.sheet{width:100%;max-height:90%;overflow:auto;animation:up .55s var(--ease);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.overlay.center{align-items:center;padding:20px}
.overlay.center>.sheet{animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.drawer{position:absolute;inset:0 auto 0 0;width:84%;background:var(--ivory);padding:22px 26px;display:flex;flex-direction:column;animation:slide .5s var(--ease)}
@keyframes slide{from{transform:translateX(-30px);opacity:.3}}
.drawer .items{display:flex;flex-direction:column;margin-top:26px}
.drawer .items button{font:500 30px/1.15 var(--serif);padding:13px 0;border-bottom:1px solid var(--line);text-align:left;transition:color .3s,padding .4s var(--ease)}
.drawer .items button:hover{color:var(--bur);padding-left:6px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:var(--ivory);box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:17px;transition:box-shadow .3s}
.opt:hover{box-shadow:inset 0 0 0 1px var(--champ)}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--bur);color:var(--bur)}
.opt .ms{color:var(--bur)}
.cities{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* misc */
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:90;background:var(--esp);color:var(--ivory);padding:14px 16px;font-size:16px;display:flex;gap:10px;align-items:center;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .5s var(--ease)}
.toast.show{transform:none;opacity:1}
.toast .ms{color:var(--champ);font-size:18px}
.fab{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));right:10px;z-index:70;height:30px;padding:0 10px;background:rgba(251,247,241,.92);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px var(--line);font:600 10.5px/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--esp)}
.fab .ms{font-size:15px}
.mapsheet button.mrow{display:flex;gap:12px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.mapsheet button.mrow b{width:24px;color:var(--champ-ink);font-weight:600;font-size:13px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--paper)}
.empty .ms{font-size:30px;color:var(--champ-ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

/* ---------- search logic ---------- */
function parseQuery(q){
  const t=q.toLowerCase(),r={cat:null,catLabel:null,color:null,attrs:[],budget:null,chips:[]};
  for(const [re,c,l] of CATS){if(re.test(t)){r.cat=c;r.catLabel=l;break}}
  for(const [re,c] of COLORS){if(re.test(t)){r.color=c;break}}
  for(const [re,a] of ATTRS){if(re.test(t))r.attrs.push(a)}
  const m=t.match(/до\s*([\d\s ]{3,})/);if(m){const v=parseInt(m[1].replace(/\D/g,""),10);if(v>200)r.budget=v}
  if(r.cat)r.chips.push({k:"cat",l:r.catLabel});
  if(r.color)r.chips.push({k:"color",l:r.color[0].toUpperCase()+r.color.slice(1)});
  r.attrs.forEach(a=>r.chips.push({k:"a:"+a,l:a[0].toUpperCase()+a.slice(1)}));
  if(r.budget)r.chips.push({k:"budget",l:"до "+fmt(r.budget)});
  return r;
}
function scoreP(p,r){let s=70;if(r.cat&&p.cat===r.cat)s+=10;if(r.color&&p.color===r.color)s+=7;r.attrs.forEach(a=>{if(p.attrs.includes(a))s+=4});return Math.min(97,s+hashN(p.id)%4)}
function searchQ(q,removed=new Set(),sort="match"){
  const r=parseQuery(q),rm=removed;
  const eff={cat:rm.has("cat")?null:r.cat,color:rm.has("color")?null:r.color,attrs:r.attrs.filter(a=>!rm.has("a:"+a)),budget:rm.has("budget")?null:r.budget};
  let list=P.filter(p=>!eff.cat||p.cat===eff.cat);
  if(eff.color){const c=list.filter(p=>p.color===eff.color||(eff.color==="блакитний"&&p.color==="синій"));if(c.length)list=c}
  let over=false;
  if(eff.budget){const b=list.filter(p=>p.price<=eff.budget);if(b.length)list=b;else over=true}
  if(!r.cat&&!r.color&&!r.attrs.length)list=P.slice(0,8);
  list=list.map(p=>({p,m:scoreP(p,eff)}));
  list.sort(sort==="price"?(a,b)=>a.p.price-b.p.price:(a,b)=>b.m-a.m);
  const min=list.length?Math.min(...list.map(x=>x.p.price)):0;
  return {r,list,min,over,stores:new Set(list.map(x=>x.p.store)).size};
}

  if(S.chatBusy||!text.trim())return;

  setTimeout(()=>{

/* looks quiz */
function buildLook(a){
  let ids=(BASE[a.occ]||BASE.date).slice();
  if(a.weather==="cold")ids=[a.occ==="party"?"c5":"c5",...ids.filter(i=>!["b1","b2"].includes(i))];
  if(a.weather==="cool"&&!ids.some(i=>byId[i].cat==="coat"||byId[i].cat==="blazer"))ids.unshift("c3");
  if(a.colors==="dark")ids=ids.map(i=>({t1:"t2",p4:"p1",k3:"l1",s2:"t2",bl2:"t2"}[i]||i));
  if(a.colors==="wine")ids=ids.map(i=>({d3:"d2",bg3:"bg1",t1:"d2",p1:"",c3:"c5"}[i]??i)).filter(Boolean);
  if(a.colors==="light")ids=ids.map(i=>({t2:"t1",p1:"p4",l1:"l2",b1:"b2",c5:"c3"}[i]||i));
  if(a.style==="sport")ids=ids.map(i=>({l1:"k1",l2:"k2"}[i]||i));
  if(a.style==="romantic")ids=ids.map(i=>({p1:"sk1",p4:"sk1"}[i]||i));
  ids=[...new Set(ids)];
  const budget=+a.budget||5000;
  let total=()=>ids.reduce((s,i)=>s+byId[i].price,0),guard=0;
  while(total()>budget&&guard++<8){const exp=ids.slice().sort((x,y)=>byId[y].price-byId[x].price);let done=false;
    for(const i of exp){const alt=ALTS[i];if(alt&&byId[alt].price<byId[i].price&&!ids.includes(alt)){ids[ids.indexOf(i)]=alt;done=true;break}}
    if(!done)break}
  return {ids,budget};
}

function lookFromText(t){t=t.toLowerCase();const a={};
  a.occ=/побачен|вечер|романт|свидан/.test(t)?"date":/офіс|робот|офис|работ/.test(t)?"office":/вечірк|клуб|свят|вечерин/.test(t)?"party":"walk";

  a.colors=/бордо|винн|бордов/.test(t)?"wine":/чорн|темн|ч[её]рн|т[её]мн/.test(t)?"dark":/світл|біл|пастел|светл|бел/.test(t)?"light":"neutral";

  const m=t.match(/до\s*([\d\s ]{3,})/);a.budget=m?String(parseInt(m[1].replace(/\D/g,""),10)):"5000";
  return a}

/* ---------- render ---------- */
const scroll=document.getElementById("scroll"),chrome=document.getElementById("chrome"),mlayer=document.getElementById("mlayer");
let timers=[],heroTimer=null;
function render(keep){
  timers.forEach(clearTimeout);timers=[];
  const top=scroll.scrollTop;
  document.body.classList.toggle("calm",!!keep);
  scroll.innerHTML=V[S.route]();
  const nav=navbar();
  chrome.innerHTML=nav+(S.route==="assistant"?assistantComposer():S.route==="looks"?looksComposer():"");
  scroll.classList.toggle("has-nav",!!nav);
  scroll.style.paddingBottom=(S.route==="assistant"||S.route==="looks")?"140px":"";
  scroll.style.scrollBehavior="auto";scroll.scrollTop=keep?top:0;scroll.style.scrollBehavior="";
  renderModal();renderMap();post();
}
function renderModal(){mlayer.innerHTML=modalHTML()}
function openModal(m){S.modal=m;renderModal()}
function closeModal(){S.modal=null;S.after=null;renderModal()}
function post(){
  clearInterval(heroTimer);
  if(S.route==="landing"){
    heroTimer=setInterval(()=>{S.scene=(S.scene+1)%3;scroll.querySelectorAll(".scene").forEach((s,i)=>s.classList.toggle("on",i===S.scene));scroll.querySelectorAll(".dots i").forEach((d,i)=>d.classList.toggle("on",i===S.scene))},5200);
    if(!S.cityAsked){S.cityAsked=true;timers.push(setTimeout(()=>{if(S.route==="landing"&&!S.modal)openModal("city")},1400))}
  }
  if(S.route==="parse"){const n=search().list.length,el=document.getElementById("cnt");let i=0;
    const step=()=>{if(!el)return;i++;el.textContent=Math.round(n*Math.min(1,i/20));if(i<20)timers.push(setTimeout(step,45))};
    timers.push(setTimeout(step,500));timers.push(setTimeout(()=>{if(S.route==="parse")go("results",true)},3000))}
  if(S.route==="assistant"||S.route==="looks")scrollEnd();
}
function go(r,replace){
  if(!V[r])return;
  if(!replace&&S.route!==r)S.hist.push(S.route);
  S.route=r;S.size=null;S.modal=null;
  render();
}
function goBack(){const r=S.hist.pop()||"search";S.route=r;S.modal=null;render()}
function toast(t,icon="check"){const el=document.getElementById("toast");el.querySelector(".ms").textContent=icon;document.getElementById("toastText").textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2600)}
function renderMap(){
  const cur=S.modal&&Object.entries(MODAL_SCREENS).find(([k,v])=>v[1]===S.modal&&v[0]===S.route);
  const active=cur?cur[0]:S.route;
  let h=`<h2>FINDLY</h2><p>Клікабельний макет · ${SCREENS.length} екранів</p>`;
  SCREENS.forEach(([k,l,g],i)=>{if(g)h+=`<div class="grp">${g}</div>`;h+=`<button data-jump="${k}" class="${active===k?"on":""}" type="button"><b>${String(i+1).padStart(2,"0")}</b>${l}</button>`});
  document.getElementById("map").innerHTML=h;
}
function jump(k){
  S.hist=[];
  const needLogin=["wishlist","share","partner","guest","profile","alerts","telegram","pro","assistant","camera","crop","photo","cart"];
  const needPro=["assistant","camera","crop","photo","partner","alerts","telegram"];
  if(needLogin.includes(k))S.logged=true;
  if(needPro.includes(k))S.pro=true;
  if(k==="login"){S.logged=false}
  if(k==="cart"&&!S.cart.length)S.cart=[{id:"j1",size:"27"},{id:"bl1",size:"S"},{id:"l1",size:"38"}];
  if(k==="partner"){S.wishTab="partner";S.partner=null;k="wishlist"}
  else if(k==="wishlist")S.wishTab="mine";
  if(k==="looks"){S.quiz={step:0,a:{}};S.look=null}
  if(k==="guest")S.guestMode="link";
  if(k==="telegram")S.tg=false;
  if(k==="photo"&&!S.upload)S.cropSel=S.cropSel==="look"?"coat":S.cropSel;
  const mm=MODAL_SCREENS[k];
  if(mm){S.route=mm[0];S.modal=null;render();S.modal=mm[1];if(mm[1]==="login")S.after=null;renderModal();renderMap();return}
  S.route=k;S.modal=null;render();
}

/* ---------- actions ---------- */
function toggleWish(id){need("login",()=>{const on=!S.wish.has(id);on?S.wish.add(id):S.wish.delete(id);toast(on?"Додано у вішліст":"Прибрано з вішліста",on?"favorite":"check");render(true)})}
function toggleCart(id){const p=byId[id];if(inCart(id)){S.cart=S.cart.filter(c=>c.id!==id);toast("Прибрано з кошика")}else{S.cart.push({id,size:S.route==="product"&&S.pid===id?(S.size||defSize(p)):defSize(p)});toast("Додано в кошик","shopping_bag")}render(true)}
function track(){const p=byId[S.pid];need("pro",()=>{
  if(S.tracked.has(p.id)){S.tracked.delete(p.id);toast("Більше не стежимо за ціною","notifications_off");render(true);return}
  const doTrack=()=>{S.tracked.set(p.id,Math.round(p.price*.85/100)*100);toast("Напишемо в Telegram, коли ціна буде "+fmt(S.tracked.get(p.id)),"notifications_active");render(true)};
  if(!S.tg){S.after={level:"login",fn:doTrack};openModal("tg");return}
  doTrack()})}
function copy(text,msg){try{navigator.clipboard.writeText(text).then(()=>toast(msg),()=>toast("Скопіюйте вручну: "+text,"content_copy"))}catch(e){toast("Скопіюйте вручну: "+text,"content_copy")}}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-jump],[data-go],[data-back],[data-wish],[data-cart],[data-uncart],[data-pid],[data-act],[data-q],[data-chip],[data-view],[data-size],[data-det],[data-upcat],[data-ptab],[data-wtab],[data-occ],[data-gift],[data-swap],[data-untrack],[data-tgt],[data-style],[data-fav],[data-close],[data-copy],[data-city],[data-menu],[data-ask],[data-quiz],[data-overlay]");
  if(!t)return;const d=t.dataset;
  if(t.hasAttribute("data-overlay")){if(e.target===t)closeModal();return}
  if(t.hasAttribute("data-close")){closeModal();return}
  if(d.jump){S.modal=null;jump(d.jump);return}
  if(d.wish){e.stopPropagation();toggleWish(d.wish);return}
  if(d.cart){e.stopPropagation();toggleCart(d.cart);return}
  if(d.uncart){S.cart=S.cart.filter(c=>c.id!==d.uncart);render(true);return}
  if(d.go){go(d.go);return}
  if(t.hasAttribute("data-back")){goBack();return}
  if(d.pid){S.pid=d.pid;S.view=0;go("product");return}
  if(d.copy){copy(d.copy,"Посилання скопійовано");return}
  if(d.city){S.city=d.city;closeModal();toast("Місто: "+d.city,"location_on");if(S.route!=="landing")render(true);return}
  if(d.menu){S.modal=null;renderModal();const k=d.menu;
    if(k==="home"||k==="about"){if(S.route!=="landing")go("landing");else render(true);if(k==="about")setTimeout(()=>{const el=document.getElementById("story");if(el){scroll.scrollTop=el.offsetTop}},60);else scroll.scrollTop=0;return}
    if(k==="assistant"){need("pro",()=>go("assistant"));return}
    go(k);return}
  if(d.q){S.query=d.q;S.removed=new Set();go("parse");return}
  if(d.ask){ask(d.ask);return}
  if(d.quiz){const [k,v]=d.quiz.split(":");S.quiz.a[k]=v;S.quiz.step++;if(S.quiz.step>=QUIZ.length)S.look=buildLook(S.quiz.a);render(true);return}
  if(d.chip){S.removed.has(d.chip)?S.removed.delete(d.chip):S.removed.add(d.chip);render(true);return}
  if(d.view){S.view=+d.view;render(true);return}
  if(d.size){S.size=d.size;render(true);return}
  if(d.det){S.cropSel=d.det;render(true);return}
  if(d.upcat){S.upCat=d.upcat;render(true);return}
  if(d.ptab){S.photoTab=d.ptab;render(true);return}
  if(d.wtab){S.wishTab=d.wtab;render(true);return}
  if(d.occ){S.occasion=d.occ;renderModal();return}
  if(d.gift){S.chosen.add(d.gift);S.myGift=d.gift;render(true);openModal("gift");return}
  if(d.swap){const i=+d.swap,cur=S.look.ids[i],alt=ALTS[cur];if(!alt||S.look.ids.includes(alt)){toast("Іншої схожої речі поки немає","info");return}S.look.ids[i]=alt;render(true);toast("Замінили на «"+byId[alt].name+"»","sync_alt");return}
  if(d.untrack){S.tracked.delete(d.untrack);render(true);return}
  if(d.tgt){S.tracked.set(d.tgt,Math.max(100,S.tracked.get(d.tgt)+(+d.d)));render(true);return}
  if(d.style){S.styles.has(d.style)?S.styles.delete(d.style):S.styles.add(d.style);render(true);return}
  if(d.fav){S.favStores.has(d.fav)?S.favStores.delete(d.fav):S.favStores.add(d.fav);render(true);return}
  if(d.act)switch(d.act){
    case "menu":openModal("menu");break;
    case "home":S.modal=null;if(S.route!=="landing")go("landing");else scroll.scrollTop=0;break;
    case "story":{const el=document.getElementById("story");if(el)scroll.scrollTop=el.offsetTop;break}
    case "city":openModal("city");break;
    case "login":S.after=null;openModal("login");break;
    case "do-login":S.logged=true;toast("Ви увійшли як Анастасія","person");if(S.after){resume()}else{closeModal();render(true)}break;
    case "logout":S.logged=false;S.pro=false;go("landing");toast("Ви вийшли з акаунта");break;
    case "pro-on":S.pro=true;toast("FINDLY PRO: 7 днів безкоштовно","auto_awesome");if(S.after){resume()}else{closeModal();render(true)}break;
    case "pro-more":S.after=null;S.modal=null;go("pro");break;
    case "assistant":need("pro",()=>go("assistant"));break;
    case "camera":go("camera");break;
    case "shoot":need("pro",()=>{S.upload=null;go("crop")});break;
    case "gallery":need("pro",()=>document.getElementById("file")?.click());break;
    case "find-similar":S.photoTab="similar";go("photo");break;
    case "find-look":S.cropSel="look";S.photoTab="similar";go("photo");break;
    case "track":track();break;
    case "tg":if(S.tg){S.tg=false;toast("Telegram вимкнено","send");render(true)}else openModal("tg");break;
    case "tg-on":S.tg=true;toast("Telegram підключено. У макеті повідомлення не приходять","send");if(S.after){const a=S.after;S.after=null;S.modal=null;renderModal();a.fn()}else{closeModal();render(true)}break;
    case "sizes":openModal("sizes");break;
    case "share":openModal("share");break;
    case "guest-view":S.guestMode="link";go("guest");break;
    case "partner-view":S.guestMode="partner";go("guest");break;
    case "partner-off":S.partner=null;toast("Доступ закрито");render(true);break;
    case "ungift":S.chosen.delete(S.myGift);S.myGift=null;closeModal();render(true);toast("Вибір скасовано","undo");break;
    case "share-item":{const p=byId[S.pid];copy(`${p.name} — ${fmt(p.price)} у ${p.store}. Знайшла на FINDLY`,"Опис речі скопійовано");break}
    case "look-cart":S.look.ids.forEach(id=>{if(!inCart(id))S.cart.push({id,size:defSize(byId[id])})});toast("Образ у кошику","shopping_bag");render(true);break;
    case "look-reset":S.quiz={step:0,a:{}};S.look=null;render();break;
    case "budget":S.budget=Math.max(1000,S.budget+(+d.d));render(true);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.modal){closeModal();return}
  if(e.key==="Enter"){const c=e.target.closest&&e.target.closest(".open[data-pid]");if(c&&e.target===c){S.pid=c.dataset.pid;S.view=0;go("product")}}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="home-search"){const v=document.getElementById("q").value.trim();if(!v){document.getElementById("q").focus();return}
    if(/образ/i.test(v)&&!/джинс|сукн|плать|тренч|пальто|штан|брюк/i.test(v)){go("looks");return}S.query=v;S.removed=new Set();S.sort="match";go("parse");return}
  if(f.id==="ask"){const i=document.getElementById("askq");ask(i.value);i.value="";return}
  if(f.id==="lookask"){const v=document.getElementById("lookq").value.trim();if(!v)return;S.quiz={step:QUIZ.length,a:lookFromText(v)};S.look=buildLook(S.quiz.a);render(true);return}
  if(f.id==="city-form"){const v=document.getElementById("cityq").value.trim();if(!v)return;S.city=v[0].toUpperCase()+v.slice(1);closeModal();toast("Місто: "+S.city,"location_on");if(S.route!=="landing")render(true);return}
  if(f.id==="partner-form"){const v=document.getElementById("pname").value.trim();if(!v)return;need("pro",()=>{S.partner={name:v,ok:false};render(true);toast("Запрошення надіслано","send");timers.push(setTimeout(()=>{if(S.partner){S.partner.ok=true;if(S.route==="wishlist")render(true)}},1800))});return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sort"){S.sort=t.value;render(true)}
  if(t.dataset.sizekey){S.sizes[t.dataset.sizekey]=t.value;toast("Розмір збережено")}
  if(t.id==="file"){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{S.upload=rd.result;S.upCat="coat";go("crop")};rd.onerror=()=>toast("Не вдалося відкрити фото, спробуйте інше","error");rd.readAsDataURL(f)}
});
document.getElementById("fab").addEventListener("click",()=>openModal("map"));

/* boot */
try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
S.route="landing";render();
})();
</script>

</body>
</html>
